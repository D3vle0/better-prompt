<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="128" height="128" rx="28" fill="#09090b" />
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#grad)" fill-opacity="0.15" stroke="url(#grad)" stroke-width="3" />

  <!-- Central Sparkle Icon -->
  <path d="M64 24 C64 46, 82 64, 104 64 C82 64, 64 82, 64 104 C64 82, 46 64, 24 64 C46 64, 64 46, 64 24 Z" fill="url(#grad)" />
  
  <!-- Small secondary sparkle -->
  <path d="M92 28 C92 36, 98 42, 106 42 C98 42, 92 48, 92 56 C92 48, 86 42, 78 42 C86 42, 92 36, 92 28 Z" fill="#38bdf8" />
</svg>
